<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coletor e Apresentador de Dados</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous"/>
    <link rel="stylesheet" href="../css/style.css"/>
</head>
<body>
    <a href="../index.html"><img src="../icone/businessman.png" alt="Logo da empresa" class="logo" /></a>
    
    <div id="botoes_menu">
        <button type="button" class="btn btn-primary"><a class="bt" href="../atividades.html">Atividades</a></button>
        <button type="button" class="btn btn-secondary"><a class="bt" href="tabelas.html">Tabelas</a></button>
        <button type="button" class="btn btn-success"><a class="bt" href="lista.html">Listas</a></button>
        <button type="button" class="btn btn-danger"><a class="bt" href="formulario.html">Formulário</a></button>
        <button type="button" class="btn btn-warning"><a class="bt" href="users.html">Usuários</a></button>
        <button type="button" class="btn btn-info"><a class="bt" href="coletdados.html">Coleta de Dados</a></button>
        <button type="button" class="btn btn-light"><a href="bd/senhas.html">Senhas</a></button>
        <button type="button" class="btn btn-dark"><a href="https://www.google.com" target="_blank">Google</a></button>

    </div>
    
    <br />

    <h1>Formulário de Recebimento e Exibição de Dados</h1>
    <div id="curriculo">
        <p>
            <fieldset>
                <form action="bd/senhas.html" method="post">
                    <legend class="arquivo">Envie seu currículo</legend>
                    <input type="file" name="arquivo" id="arquivo"/><br/>
                    <input type="submit" value="upload"/>
                </form>
            </fieldset>
        </p>
    </div>
    <div id="pesquisa">
        <p>
            <fieldset>
                <form action="bd/senhas.html" method="post">
                    <legend class="pesquisa">Google</legend>
                    <input type="search" name="buscar" id="buscar" placeholder="Pesquisar"/>
                    <input type="submit" value="Pesquisa do Google"/>
                </form>
            </fieldset>
        </p>
    </div>
    <div id="newsletter">
        <p>
            <fieldset>
                <form action="bd/senhas.html" method="post">
                    <legend class="noticias">Assine nossa newsletter</legend>
                    <input type="email" name="email" id="email"/>
                    <input type="image" src="../icone/newsletter.png" alt="botão de assinatura"/>
                </form>
            </fieldset>
        </p>
    </div>
    <div id="url">
        <p>
            <fieldset>
                <form action="bd/senhas.html" method="post">
                    <legend class="pagina">Informe sua pagina/site da empresa</legend>
                    <input type="url" name="url" id="url" placeholder="http://www.exemplo.com.br"/><br/>
                    <input type="submit" value="Enviar"/>
                </form>
            </fieldset>
        </p>
    </div>
    <div id="midia">
        <p><audio src="../midia/alarm.mp3" controls></audio></p>
        <p><video src="../midia/earthone.mp4" controls loop></video></p>
    </div>

    <div id="mapa">
        <iframe src="https://maps.google.com" frameborder="0"></iframe>
    </div>
        



</body>
</html>
