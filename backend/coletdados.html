<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coletor e Apresentador de Dados</title>
</head>
<body>
    <a href="../index.html"><img src="../icone/businessman.png" alt="Logo da empresa" /></a>
    <br />

    <div id="curriculo">
        <p>
            <fieldset>
                <form action="bd/senhas.html" method="post">
                    <legend>Envie seu currículo</legend>
                    <input type="file" name="arquivo" id="arquivo"/><br/>
                    <input type="submit" value="upload"/>
                </form>
            </fieldset>
        </p>
    </div>
    <div id="pesquisa">
        <p>
            <fieldset>
                <form action="bd/senhas.html" method="post">
                    <legend>Google</legend>
                    <input type="search" name="buscar" id="buscar" placeholder="Pesquisar"/>
                    <input type="submit" value="Pesquisa do Google"/>
                </form>
            </fieldset>
        </p>
    </div>
    <div id="newsletter">
        <p>
            <fieldset>
                <form action="bd/senhas.html" method="post">
                    <legend>Assine nossa newsletter</legend>
                    <input type="email" name="email" id="email"/>
                    <input type="image" src="../icone/newsletter.png" alt="botão de assinatura"/>
                </form>
            </fieldset>
        </p>
    </div>
    <div id="url">
        <p>
            <fieldset>
                <form action="bd/senhas.html" method="post">
                    <legend>Informe sua pagina/site da empresa</legend>
                    <input type="url" name="url" id="url" placeholder="http://www.exemplo.com.br"/><br/>
                    <input type="submit" value="Enviar"/>
                </form>
            </fieldset>
        </p>
    </div>
    <div id="midia">
        <p><audio src="../midia/alarm.mp3" controls></audio></p>
        <p><video src="../midia/earthone.mp4" controls loop></video></p>
    </div>

    <div id="mapa">
        <iframe src="https://maps.google.com" frameborder="0"></iframe>
    </div>
        



</body>
</html>
